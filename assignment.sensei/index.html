<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXPENSE TRACKER</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>EXPENSE TRACKER</h1>
    <form id="expenseForm" class="main">
        <input id="descInput" type="text" placeholder="Product description" required>
        <input id="amountInput" type="number" min="0" step="0.01" placeholder="Product price" required>
        <button id="addBtn" type="submit">ADD</button>
        <button id="clearBtn" type="button"> 🗑️ </button>
    </form>

    <div class="card">
        <ul id="productList">

        </ul>
    </div>
    <p id="total">Count: </p>

    
</body>
</html>
